      description: 'Authorization policy: public. Validate actor, resource ownership
        or assignment, and applicable state on the server.'
      security: []
      x-actor: public
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: per_page
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - newest
          - oldest
          default: newest
      - name: content_type_id
        in: query
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Profile'
                  meta:
                    $ref: '#/components/schemas/Pagination'
              example:
                data:
                - &id002
                  id: 1
                  display_name: sample
                  bio: sample
                  is_open_to_work: true
                meta:
                  page: 1
                  per_page: 20
                  has_more: false
        '400':
          description: Invalid request
