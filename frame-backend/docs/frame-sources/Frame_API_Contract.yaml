components:
  schemas:
    User:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        role:
          type: string
          enum:
          - creator
          - editor
          - admin
          - support
        status:
          type: string
          enum:
          - pending_verification
          - active
          - restricted
          - suspended
          - closed
      required:
      - id
      - name
      - email
      - role
      - status
    Profile:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        display_name:
          type: string
          minLength: 1
          maxLength: 255
        bio:
          type: string
          minLength: 1
          maxLength: 5000
        is_open_to_work:
          type: boolean
      required:
      - id
      - display_name
      - bio
      - is_open_to_work
    ContentType:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 255
      required:
      - id
      - name
    Portfolio:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 255
        content_type_id:
          type: integer
          format: int64
          minimum: 1
        external_url:
          type: string
          format: uri
      required:
      - id
      - title
      - content_type_id
      - external_url
    Verification:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        editor_id:
          type: integer
          format: int64
          minimum: 1
        status:
          type: string
          enum:
          - draft
          - pending
          - under_review
          - approved
          - rejected
          - needs_changes
          - withdrawn
        document_type:
          type: string
          minLength: 1
          maxLength: 255
      required:
      - id
      - editor_id
      - status
      - document_type
    Work:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        type:
          type: string
          enum:
          - job
          - service_request
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          minLength: 1
          maxLength: 5000
        status:
          type: string
          enum:
          - draft
          - open
          - paused
          - pending_agreement
          - in_progress
          - in_review
          - completed
          - disputed
          - cancelled
          - closed
        creator_id:
          type: integer
          format: int64
          minimum: 1
        editor_id:
          type: integer
          format: int64
          minimum: 1
        agreed_price:
          type: string
          pattern: ^(0|[1-9][0-9]{0,9})\.[0-9]{2}$
        currency:
          type: string
          pattern: ^[A-Z]{3}$
      required:
      - id
      - type
      - title
      - description
      - status
    Application:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        work_item_id:
          type: integer
          format: int64
          minimum: 1
        editor_id:
          type: integer
          format: int64
          minimum: 1
        status:
          type: string
          enum:
          - pending
          - shortlisted
          - accepted
          - rejected
          - withdrawn
        proposed_price:
          type: string
          pattern: ^(0|[1-9][0-9]{0,9})\.[0-9]{2}$
      required:
      - id
      - work_item_id
      - editor_id
      - status
      - proposed_price
    Service:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        editor_id:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          minLength: 1
          maxLength: 5000
        status:
          type: string
          enum:
          - draft
          - active
          - paused
        price:
          type: string
          pattern: ^(0|[1-9][0-9]{0,9})\.[0-9]{2}$
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        delivery_days:
          type: integer
          minimum: 1
      required:
      - id
      - editor_id
      - title
      - description
      - status
      - price
      - currency
      - delivery_days
    Agreement:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        work_item_id:
          type: integer
          format: int64
          minimum: 1
        status:
          type: string
          minLength: 1
          maxLength: 255
        agreed_price:
          type: string
          pattern: ^(0|[1-9][0-9]{0,9})\.[0-9]{2}$
        currency:
          type: string
          pattern: ^[A-Z]{3}$
      required:
      - id
      - work_item_id
      - status
      - agreed_price
      - currency
    Upload:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
